{% extends 'base.html' %}

{% block title %}Đăng Ký Tài Khoản - EventAI Pro{% endblock %}

{% block content %}
<div class="container py-5 my-md-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7 col-xl-6">
            <div class="apple-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="mb-1">Tạo Tài Khoản Mới</h3>
                    <p class="small" style="color: var(--text-secondary);">Đăng ký để khám phá sự kiện và nhận đề xuất AI cá nhân hóa</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Tên đăng nhập *</label>
                            <input type="text" name="username" class="form-control" required placeholder="tuannguyen26">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Họ và tên *</label>
                            <input type="text" name="full_name" class="form-control" required placeholder="Nguyễn Văn A">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email *</label>
                            <input type="email" name="email" class="form-control" required placeholder="example@domain.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Số điện thoại</label>
                            <input type="tel" name="phone" class="form-control" placeholder="0987654321">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Cơ quan / Tổ chức</label>
                            <input type="text" name="organization" class="form-control" placeholder="Công ty ABC / Đại học FPT">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Chủ đề quan tâm (Dùng cho AI Gợi ý)</label>
                            <input type="text" name="interests" class="form-control" placeholder="Ví dụ: Trí tuệ nhân tạo, GenAI, Cloud, Python, Data Science">
                            <small class="d-block mt-1" style="font-size: 0.75rem; color: var(--text-tertiary);">AI sẽ dùng thông tin này để đề xuất sự kiện phù hợp nhất cho bạn.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Mật khẩu *</label>
                            <input type="password" name="password" class="form-control" required placeholder="••••••••">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Xác nhận mật khẩu *</label>
                            <input type="password" name="confirm_password" class="form-control" required placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 mt-4">Hoàn Tất Đăng Ký</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top small" style="border-color: var(--border-hairline) !important; color: var(--text-secondary);">
                    Đã có tài khoản? <a href="{{ url_for('auth.login') }}" class="text-primary fw-medium">Đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Đăng Ký Tài Khoản - EventAI Pro{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="glass-panel p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1">Tạo Tài Khoản Mới</h3>
                    <p class="text-muted small">Đăng ký để khám phá sự kiện và nhận đề xuất AI cá nhân hóa</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-semibold">Tên đăng nhập *</label>
                            <input type="text" name="username" class="form-control bg-dark border-secondary text-light" required placeholder="tuannguyen26">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-semibold">Họ và tên *</label>
                            <input type="text" name="full_name" class="form-control bg-dark border-secondary text-light" required placeholder="Nguyễn Văn A">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-light small fw-semibold">Email *</label>
                            <input type="email" name="email" class="form-control bg-dark border-secondary text-light" required placeholder="example@domain.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-semibold">Số điện thoại</label>
                            <input type="tel" name="phone" class="form-control bg-dark border-secondary text-light" placeholder="0987654321">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-semibold">Cơ quan / Tổ chức</label>
                            <input type="text" name="organization" class="form-control bg-dark border-secondary text-light" placeholder="Công ty ABC / Đại học FPT">
                        </div>
                        <div class="col-12">
                            <label class="form-label text-light small fw-semibold">Chủ đề quan tâm (Dùng cho AI Gợi ý)</label>
                            <input type="text" name="interests" class="form-control bg-dark border-secondary text-light" placeholder="Ví dụ: Trí tuệ nhân tạo, GenAI, Cloud, Python, Data Science">
                            <small class="text-muted" style="font-size: 0.75rem;">AI sẽ dùng thông tin này để đề xuất sự kiện phù hợp nhất cho bạn.</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-semibold">Mật khẩu *</label>
                            <input type="password" name="password" class="form-control bg-dark border-secondary text-light" required placeholder="••••••••">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light small fw-semibold">Xác nhận mật khẩu *</label>
                            <input type="password" name="confirm_password" class="form-control bg-dark border-secondary text-light" required placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-2 mt-4 fw-semibold">Hoàn Tất Đăng Ký</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25 text-muted small">
                    Đã có tài khoản? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
